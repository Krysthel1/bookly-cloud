name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

      - name: Compilar aplicación de producción
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.bookly.example.com/api/v1' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: bookly-frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-aws:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-aws # Configurar aprobación manual requerida en GitHub Environments
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: bookly-frontend-dist
          path: dist

      - name: Autenticar en AWS mediante OIDC (sin credenciales permanentes)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sincronizar archivos en Amazon S3
        run: aws s3 sync dist/ s3://${{ vars.S3_FRONTEND_BUCKET }} --delete

      - name: Invalidar caché de Amazon CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
