name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookly
          POSTGRES_PASSWORD: bookly_ci_password
          POSTGRES_DB: bookly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar linter (Ruff)
        run: ruff check app tests scripts

      - name: Verificar migraciones Alembic en PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://bookly:bookly_ci_password@localhost:5432/bookly_ci
          DIRECT_DATABASE_URL: postgresql+psycopg://bookly:bookly_ci_password@localhost:5432/bookly_ci
        run: alembic upgrade head

      - name: Ejecutar pruebas unitarias e integración (Pytest)
        run: pytest -v

      - name: Construir imagen Docker del backend
        run: docker build -t bookly-backend:${{ github.sha }} .

  deploy-aws:
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-aws # Requiere aprobación explícita en GitHub Environments
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en AWS mediante OIDC (sin claves permanentes)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen en Amazon ECR
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bookly-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Refrescar instancias del Auto Scaling Group
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.AWS_ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'
